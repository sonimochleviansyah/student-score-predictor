<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediksi Skor Ujian</title>
    <!-- Memuat CSS Bootstrap untuk tampilan web -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h4>Prediksi Skor Ujian</h4>
                    </div>
                    <div class="card-body">
                        <!-- Formulir Input -->
                        <form action="/predict" method="POST">
                            <div class="mb-3">
                                <label for="jam_belajar" class="form-label">Masukkan Jumlah Jam Belajar:</label>
                                <input type="number" step="0.1" class="form-control" id="jam_belajar" name="jam_belajar" required placeholder="Contoh: 4.5">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Prediksi Skor</button>
                        </form>

                        <!-- Menampilkan Hasil Prediksi jika ada -->
                        {% if hasil_prediksi %}
                        <div class="alert alert-success mt-4 text-center" role="alert">
                            <h5>Hasil Prediksi</h5>
                            <p>Jika kamu belajar selama <strong>{{ jam_input }} jam</strong>,</p>
                            <p class="mb-0">Estimasi Skor Ujian: <strong>{{ hasil_prediksi }}</strong></p>
                        </div>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
